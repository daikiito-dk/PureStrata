[project]
name = "purestrata"
version = "0.3.0"
description = "Open data layer for manufacturing AI: structure drawings, spec sheets, and failure knowledge into LLM tools and fine-tuning datasets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daiki Ito" }]
requires-python = ">=3.10"
keywords = [
  "manufacturing",
  "cad",
  "dxf",
  "manuals",
  "failure-analysis",
  "llm",
  "mcp",
  "tool-calling",
  "fine-tuning",
  "rag",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/daikiito-dk/PureStrata"
Repository = "https://github.com/daikiito-dk/PureStrata"

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
mcp = ["mcp>=1.2"]
embeddings = ["sentence-transformers>=3.0"]
llamaindex = ["llama-index-core>=0.10"]
distilabel = ["distilabel>=1.0"]

[project.scripts]
purestrata = "purestrata.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "pypdf>=4.0",
  "mcp>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/purestrata"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
