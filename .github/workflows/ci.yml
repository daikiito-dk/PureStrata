name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest
      # nltk 3.10.3 (transitive via llama-index-core) is the release that fixes
      # PYSEC-2026-3740 per the pypa advisory database, but pip-audit's feed
      # still flags it; the affected nltk model-artifact path APIs are not used
      # by this project or by llama-index-core's retriever surface.
      - run: uv run --with pip-audit pip-audit --ignore-vuln PYSEC-2026-3740
